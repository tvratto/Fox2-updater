<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FOX2 Minimal Connector</title>
  <style>
    body {
      background: #0e1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px;
    }
    .card {
      background: #161b22;
      max-width: 480px;
      margin: auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #238636;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    #log {
      margin-top: 16px;
      background: #0b1020;
      border-radius: 8px;
      padding: 12px;
      height: 200px;
      overflow: auto;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      border: 1px solid #1f2a44;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>FOX2 ESP32-S2 Connector</h2>
    <p>Manually enter bootloader mode before clicking connect.</p>
    <button id="connect">Connect</button>
    <div id="log"></div>
  </div>

  <script type="module">
    import { ESPLoader, Transport } from "./esptool.js";

    const logEl = document.getElementById("log");

    const terminal = {
      clean() {
        logEl.textContent = "";
      },
      writeLine(text) {
        logEl.textContent += text + "\n";
        logEl.scrollTop = logEl.scrollHeight;
        console.log(text);
      },
      write(text) {
        logEl.textContent += text;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(text);
      }
    };

    document.getElementById("connect").onclick = async () => {
      try {
        terminal.clean();
        terminal.writeLine("⚡ Enter bootloader mode manually first.");
        terminal.writeLine("Requesting serial port...");

        const port = await navigator.serial.requestPort();

        terminal.writeLine("Creating transport...");

        const transport = new Transport(port);

        const loader = new ESPLoader({
          transport: transport,
          baudrate: 115200,
          terminal: terminal,
          debugLogging: true
        });

        terminal.writeLine("Connecting to ESP32...");

        // Skip auto reset
        await loader.connect(false);

        terminal.writeLine("✅ Connected successfully!");
        terminal.writeLine("Chip: " + loader.chip.CHIP_NAME);

      } catch (err) {
        terminal.writeLine("❌ ERROR: " + err.message);
        console.error(err);
      }
    };
  </script>
</body>
</html>
