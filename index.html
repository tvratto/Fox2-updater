<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FOX2 Firmware Update</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
      background: #f5f5f5;
    }
    h1 {
      color: #222;
    }
    .card {
      background: white;
      padding: 30px;
      display: inline-block;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    button {
      font-size: 18px;
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #007aff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FOX2 App Update</h1>
    <p>This update will NOT erase your data.</p>
    <esp-web-install-button manifest="manifest.json">
      <button>Install Update</button>
    </esp-web-install-button>
    <p style="margin-top:20px;font-size:14px;">
      Use Chrome or Edge. Plug device in before clicking Install.
    </p>
  </div>
</body>
</html>
