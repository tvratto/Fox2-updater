<!DOCTYPE html> 
<html>
  <head>
    <meta charset="utf-8" />
    <title>FOX2 Firmware Updater</title>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js?module">
    </script>
    <style>
      body {
        background: #0e1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding-top: 80px;
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        color: #9da7b3;
      }
    </style>
  </head>

  <body>
    <h1>FOX2 Firmware Updater</h1>
    <p>Put device in bootloader mode before clicking Install.</p>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">
        Install / Update Firmware
      </button>
    </esp-web-install-button>

  </body>
</html>
