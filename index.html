<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>FOX2 Firmware Updater</title>

<style>
body {
  background: #0e1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 40px;
}

.card {
  background: #161b22;
  padding: 30px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

h1 {
  margin-top: 0;
  font-weight: 600;
}

button, select {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

button {
  background: #238636;
  color: white;
  cursor: pointer;
}

button:disabled {
  background: #30363d;
  cursor: not-allowed;
}

select {
  background: #21262d;
  color: white;
}

.progress {
  margin-top: 20px;
  height: 10px;
  background: #30363d;
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2ea043;
  transition: width 0.2s;
}

.log {
  margin-top: 20px;
  background: #0d1117;
  padding: 10px;
  font-size: 12px;
  text-align: left;
  height: 140px;
  overflow-y: auto;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="card">
  <h1>FOX2 Updater</h1>

  <button id="connectBtn">Connect Device</button>

  <select id="firmwareSelect" disabled>
    <option value="">Select Firmware</option>
    <option value="firmware/fox2_prod.bin">Production</option>
    <option value="firmware/fox2_beta.bin">Beta</option>
  </select>

  <button id="flashBtn" disabled>Flash Firmware</button>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script type="module">
import { ESPLoader, Transport } from "./esptool.js";

const logEl = document.getElementById("log");
const progressBar = document.getElementById("progressBar");
const connectBtn = document.getElementById("connectBtn");
const flashBtn = document.getElementById("flashBtn");
const firmwareSelect = document.getElementById("firmwareSelect");

let loader;

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

connectBtn.onclick = async () => {
  try {
    log("⚡ Enter bootloader mode manually first.");

    const port = await navigator.serial.requestPort();
    const transport = new Transport(port);

    loader = new ESPLoader({
      transport,
      baudrate: 115200,
      terminal: {
        write: () => {},
        writeLine: () => {},
        clean: () => {}
      },
      debugLogging: false
    });

    log("Connecting...");
    await loader.connect(false);

    log("✅ Connected: " + loader.chip.CHIP_NAME);

    firmwareSelect.disabled = false;
    flashBtn.disabled = false;

  } catch (err) {
    log("❌ " + err.message);
  }
};

flashBtn.onclick = async () => {
  try {
    const firmwarePath = firmwareSelect.value;
    if (!firmwarePath) {
      alert("Select firmware first.");
      return;
    }

    flashBtn.disabled = true;
    progressBar.style.width = "0%";

    log("Downloading firmware...");

    const response = await fetch(firmwarePath);
    const firmwareData = await response.arrayBuffer();

    log("Flashing...");

    await loader.flash({
      fileArray: [{
        data: firmwareData,
        address: 0x1000
      }],
      flashSize: "keep",
      eraseAll: false,
      compress: true,
      reportProgress: (fileIndex, written, total) => {
        const percent = Math.floor((written / total) * 100);
        progressBar.style.width = percent + "%";
      }
    });

    log("🎉 Flash complete!");

    flashBtn.disabled = false;

  } catch (err) {
    log("❌ Flash error: " + err.message);
    flashBtn.disabled = false;
  }
};
</script>

</body>
</html>
