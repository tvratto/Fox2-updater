<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fox2 Simple Flasher</title>
  <style>
    body { font-family: monospace; background:#111; color:#eee; padding:20px; }
    button { padding:10px 20px; margin:5px; }
    #log { margin-top:20px; white-space:pre-wrap; }
  </style>
</head>
<body>

<h2>Fox2 Simple Flasher</h2>

<p>
1) Hold BOOT<br>
2) Plug in device<br>
3) Click Connect & Flash
</p>

<button id="btnFlash">Connect & Flash</button>

<div id="log"></div>

<script src="./lib/esptool.js"></script>

<script>
const logDiv = document.getElementById("log");

function log(msg) {
  logDiv.textContent += msg + "\n";
}

document.getElementById("btnFlash").onclick = async () => {

  try {

    log("Requesting serial port...");
    const port = await navigator.serial.requestPort();

    log("Creating transport...");
    const transport = new Transport(port, true); // disable DTR/RTS

    const loader = new ESPLoader({
      transport: transport,
      baudrate: 115200,
      terminal: {
        clean() {},
        writeLine: log,
        write: log
      },
      debugLogging: false
    });

    log("Connecting...");
    await loader.connect(false);   // skip reset
    log("Connected to " + loader.chip.CHIP_NAME);

    log("Fetching firmware...");
    const response = await fetch("./firmware/fox2.bin");
    const firmware = new Uint8Array(await response.arrayBuffer());

    log("Flashing (no stub, 115200)...");
    await loader.writeFlash({
      fileArray: [{
        data: firmware,
        address: 0x1000
      }],
      eraseAll: true,
      compress: false,
      reportProgress: (p, written, total) => {
        log("Progress: " + Math.floor(p * 100) + "%");
      }
    });

    log("Done!");
    log("You can unplug device.");

  } catch (err) {
    log("ERROR: " + err.message);
    console.error(err);
  }

};
</script>

</body>
</html>
