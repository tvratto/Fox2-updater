<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fox2 App Updater2</title>
<style>
  body { font-family: monospace; background:#111; color:#eee; padding:20px; }
  button { padding:10px 20px; margin:5px; }
  #log { margin-top:20px; white-space:pre-wrap; }
</style>
</head>
<body>

<h2>Fox2 App Updater</h2>

<p>
1) Hold BOOT<br>
2) Plug in device<br>
3) Click Update
</p>

<button id="btnUpdate">Update App</button>

<div id="log"></div>

<script type="module">

// Import esptool properly as a module
import { ESPLoader, Transport }
  from "https://cdn.jsdelivr.net/npm/esptool-js@0.5.7/dist/web/index.js";

const logDiv = document.getElementById("log");

function log(msg) {
  logDiv.textContent += msg + "\n";
}

document.getElementById("btnUpdate").onclick = async () => {

  try {

    log("Requesting serial port...");
    const port = await navigator.serial.requestPort();

    log("Creating transport...");
    const transport = new Transport(port, true);

    const loader = new ESPLoader({
      transport,
      baudrate: 115200,
      terminal: {
        clean() {},
        writeLine: log,
        write: log
      },
      debugLogging: false
    });

    log("Connecting...");
    await loader.connect(false);
    log("Connected to " + loader.chip.CHIP_NAME);

    log("Fetching firmware...");
    const response = await fetch("./firmware/fox2_stable.bin");
    const firmware = new Uint8Array(await response.arrayBuffer());

    log("Flashing app at 0x10000...");
    await loader.writeFlash({
      fileArray: [{
        data: firmware,
        address: 0x10000
      }],
      eraseAll: false,
      compress: false,
      reportProgress: (p) => {
        log("Progress: " + Math.floor(p * 100) + "%");
      }
    });

    log("Update complete!");
    log("Unplug and reboot device.");

  } catch (err) {
    log("ERROR: " + err.message);
    console.error(err);
  }

};

</script>

</body>
</html>
