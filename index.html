<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FOX2 App Update</title>

  <!-- Load esptool-js web bundle from jsDelivr (CORS-friendly) -->
  <script src="https://cdn.jsdelivr.net/npm/esptool-js@latest/dist/web/esptool.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; background: #f5f5f5; }
    .card { background: white; padding: 30px; display: inline-block; border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 440px; }
    button { font-size: 16px; padding: 10px 18px; margin: 8px; border-radius: 6px;
             border: none; background: #007aff; color: white; cursor: pointer; }
    #console { text-align: left; background: #111; color: #0f0; padding: 10px; margin-top: 15px;
               height: 220px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 6px; }
  </style>
</head>

<body>
  <div class="card">
    <h2>FOX2 App Update</h2>

    <p><strong>1)</strong> Unplug device</p>
    <p><strong>2)</strong> Hold <b>BOOT</b> and plug it in</p>
    <p><strong>3)</strong> Click <b>Connect</b>, then <b>Flash</b></p>

    <button onclick="connectDevice()">Connect</button>
    <button onclick="flashDevice()">Flash</button>

    <div id="console"></div>
  </div>

  <script>
    let device, transport, loader;

    function log(msg) {
      const el = document.getElementById("console");
      el.textContent += msg + "\\n";
      el.scrollTop = el.scrollHeight;
    }

    async function connectDevice() {
      try {
        if (!("serial" in navigator)) {
          log("WebSerial not supported. Use Chrome/Edge on desktop.");
          return;
        }

        log("Requesting serial port...");
        device = await navigator.serial.requestPort();

        log("Opening transport...");
        transport = new ESPLoader.Transport(device);

        // Keep baud conservative for stability on macOS + ESP32-S2
        loader = new ESPLoader({
          transport,
          baudrate: 115200,
          terminal: { writeLine: log, write: log }
        });

        log("Connecting to bootloader...");
        await loader.connect();
        log("Connected.");
      } catch (e) {
        log("Connect error: " + (e?.message || e));
        console.error(e);
      }
    }

    async function flashDevice() {
      try {
        if (!loader) {
          log("Please click Connect first.");
          return;
        }

        log("Fetching firmware.bin...");
        const res = await fetch("firmware.bin", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to fetch firmware.bin: HTTP " + res.status);
        const firmware = await res.arrayBuffer();

        log("Writing app to 0x10000 (keeps bootloader/partitions/SPIFFS)...");
        await loader.writeFlash({
          fileArray: [{ data: firmware, address: 0x10000 }],
          flashSize: "4MB",
          compress: true
        });

        log("Flash done. Resetting device...");
        await loader.hardReset();

        log("✅ Done. If it doesn't reboot, press RESET once.");
      } catch (e) {
        log("Flash error: " + (e?.message || e));
        console.error(e);
      }
    }
  </script>
</body>
</html>
